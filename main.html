    <script>
        // 📱 Стрілки горизонтальної прокрутки меню
        document.addEventListener('DOMContentLoaded', function() {
            const scrollLeft = document.querySelector('.menu-scroll-left');
            const scrollRight = document.querySelector('.menu-scroll-right');
            const menuItems = document.getElementById('menu-items-to-hide');

            if (scrollLeft && scrollRight && menuItems) {
                const scrollAmount = 150;
                const mainMenu = menuItems.closest('.main-menu');

                function updateArrowVisibility() {
                    const shouldShow =
                        window.innerWidth <= 550 &&
                        menuItems.style.display !== 'none' &&
                        menuItems.scrollWidth > menuItems.clientWidth + 4;

                    if (mainMenu) {
                        mainMenu.classList.toggle('menu-scroll-arrows-visible', shouldShow);
                    }
                }

                scrollLeft.addEventListener('click', function(e) {
                    e.preventDefault();
                    menuItems.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                });

                scrollRight.addEventListener('click', function(e) {
                    e.preventDefault();
                    menuItems.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                });

                // 📜 По дефолту скролимо в кінець (щоб видно 🔍)
                function scrollToEnd() {
                    updateArrowVisibility();
                    if (window.innerWidth <= 550 && menuItems.style.display !== 'none' && menuItems.scrollWidth > menuItems.clientWidth) {
                        menuItems.scrollLeft = menuItems.scrollWidth;
                    }
                }

                // Спостерігаємо за зміною display (меню спочатку display:none)
                const styleObserver = new MutationObserver(function() {
                    if (menuItems.style.display !== 'none') {
                        setTimeout(scrollToEnd, 100);
                        styleObserver.disconnect();
                    }
                });
                styleObserver.observe(menuItems, { attributes: true, attributeFilter: ['style'] });

                // 🤖 Повторний скрол при додаванні нових елементів (Атлас тощо)
                const childObserver = new MutationObserver(function() {
                    updateArrowVisibility();
                    setTimeout(scrollToEnd, 150);
                });
                childObserver.observe(menuItems, { childList: true, subtree: false });

                window.addEventListener('resize', function() {
                    updateArrowVisibility();
                    setTimeout(updateArrowVisibility, 150);
                }, { passive: true });

                updateArrowVisibility();

                // Вимикаємо спостерігач через 10с (вже все підвантажилось)
                setTimeout(function() { childObserver.disconnect(); }, 10000);
            }
        });
    </script>
